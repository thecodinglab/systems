name: update dependencies

on:
  schedule:
    # Mondays 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Only lock-file updates happen here and nothing is built; the git-crypt
      # encrypted files stay unreadable on the runner.
      - name: Update flake inputs
        run: |
          # kakeibo is a private repository the runner cannot fetch, it gets
          # bumped locally via scripts/update.sh. The `local` path input is a
          # per-machine escape hatch (see local/README.md) and never bumped.
          mapfile -t inputs < <(jq -r --argjson exclude '["kakeibo"]' '
            .nodes as $nodes
            | $nodes.root.inputs
            | to_entries[]
            | select(.value | type == "string")
            | select(.key as $k | $exclude | index($k) | not)
            | select($nodes[.value].locked.type != "path")
            | .key
          ' flake.lock)
          echo "Updating: ${inputs[*]}"
          nix flake update "${inputs[@]}"

      - name: Update nvfetcher sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keyfile="$RUNNER_TEMP/nvfetcher-keys.toml"
          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > "$keyfile"
          nix run nixpkgs#nvfetcher -- --config nvfetcher.toml --build-dir _sources --keyfile "$keyfile"
          rm -f "$keyfile"

      # Catches bumps that break evaluation; a failure still opens the pull
      # request, but as a draft. hestia reads a git-crypt file and macmini needs
      # the private kakeibo input, so the Macs are skipped. Inputs are fetched
      # lazily, so the NixOS hosts never touch kakeibo; the empty stub is only a
      # safeguard in case one of them starts referencing it.
      - name: Evaluate configurations
        id: eval
        continue-on-error: true
        run: |
          stub="$RUNNER_TEMP/kakeibo-stub"
          mkdir -p "$stub"
          echo '{ outputs = _: { }; }' > "$stub/flake.nix"

          failed=()
          for host in desktop server apollo hermes; do
            echo "::group::$host"
            nix eval --no-write-lock-file --override-input kakeibo "path:$stub" \
              --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" || failed+=("$host")
            echo
            echo "::endgroup::"
          done

          if (( ${#failed[@]} )); then
            echo "::error::evaluation failed for: ${failed[*]}"
            exit 1
          fi

      # needs "Allow GitHub Actions to create and approve pull requests" in the
      # repository settings (Actions > General > Workflow permissions)
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-dependencies
          title: "chore: update dependencies"
          commit-message: "chore: update dependencies"
          draft: ${{ steps.eval.outcome == 'failure' }}
          body: |
            Automated update of flake inputs (except private/local ones) and nvfetcher sources.

            Evaluation of desktop, server, apollo and hermes: **${{ steps.eval.outcome }}** (see the workflow run for details; hestia, macbookpro and macmini are not checked).
          add-paths: |
            flake.lock
            _sources/**
          delete-branch: true

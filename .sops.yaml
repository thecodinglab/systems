      - age:
        - *personal
        - *user_florian
        - *darwin_macbookpro
  - path_regex: ^home/florian/secrets.yaml$
    key_groups:
      - age:
        - *personal
        - *user_florian
  - path_regex: ^infra/secrets.yaml$
    key_groups:
      - age:
        - *personal
        - *user_florian
  - path_regex: ^home-assistant/secrets.yaml$

        - *user_florian
        - *nixos_desktop
  - path_regex: ^hosts/server/secrets.yaml$
    key_groups:
      - age:
        - *personal
        - *user_florian
        - *nixos_server
  - path_regex: hermes/secrets.yaml$
    key_groups:
      - age:
        - *personal
        - *user_florian
        - *server_hermes
  - path_regex: ^hosts/macmini/secrets.yaml$
